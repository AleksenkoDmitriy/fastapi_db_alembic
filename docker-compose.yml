services:
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - '127.0.0.1:5436:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U blog" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: application
    build: .
    ports:
      - '127.0.0.1:8020:8000'
    pull_policy: build
    command: sh -c "/fastapi_app/src/start.sh"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./fastapi_app:/fastapi_app
      - ./alembic:/alembic
      - ./logs:/fastapi_app/logs
      - ./uploads:/fastapi_app/uploads
    env_file:
      - .env
    networks:
      - app_network

networks:
  app_network:
    name: app_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
        
volumes:
  postgres_data: