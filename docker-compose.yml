services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./fastapi_app:/fastapi_app
      - ./alembic:/alembic
      - ./logs:/fastapi_app/logs

volumes:
  postgres_data: